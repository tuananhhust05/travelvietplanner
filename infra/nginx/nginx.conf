user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 25m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name waki.autos www.waki.autos;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name waki.autos www.waki.autos;

        ssl_certificate     /etc/letsencrypt/live/waki.autos/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/waki.autos/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Content Security Policy — blocks data: script injection (crypto drainer vector)
        # while allowing Next.js inline scripts/styles, self-hosted resources, and the
        # external CDNs used by the EarthGlobe component (three-globe imagery + geo data).
        # img-src takes the whole https: scheme because chat link previews render
        # og:image from arbitrary third-party sites, which no fixed allowlist can cover
        # (Google avatars and github.com's ctfassets CDN were both being refused).
        # Images cannot execute, so this does not reopen the script-injection vector;
        # the residual cost is that a sender learns the recipient's IP when a preview
        # loads. Proxying og:images through our own SSRF-guarded fetch would close that.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://waki.autos wss://waki.autos https://raw.githubusercontent.com https://api.giphy.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

        # Docker embedded DNS
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:4000;
        set $web_upstream http://web:3000;

        # SSE endpoint
        location /api/v1/planner/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # NextAuth routes -> Next.js (must be before /api/)
        location /api/auth/ {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User-uploaded files served directly from host filesystem
        location /file/ {
            alias /data/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # REST API
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO
        location /socket.io/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Next.js
        location / {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
