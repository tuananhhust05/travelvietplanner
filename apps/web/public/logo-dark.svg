<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="travelvietplaner">
  <title>travelvietplaner</title>
  <!-- V icon: stylised flight-path arc doubling as mountain silhouette -->
  <path d="M6 8 Q13 10 20 30 Q27 10 34 8" stroke="#3d7a5e" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- inner ridge line for depth -->
  <path d="M11 14 Q15.5 22 20 30 Q24.5 22 29 14" stroke="#3d7a5e" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <!-- compass-rose spark at apex -->
  <circle cx="20" cy="30" r="2.8" fill="#c8973a"/>
  <line x1="20" y1="26.5" x2="20" y2="24.5" stroke="#c8973a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="33.5" x2="20" y2="35.5" stroke="#c8973a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16.5" y1="30" x2="14.5" y2="30" stroke="#c8973a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23.5" y1="30" x2="25.5" y2="30" stroke="#c8973a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- wordmark: "travelviet" light + "planer" slightly bolder -->
  <text x="41" y="19" font-family="system-ui,-apple-system,sans-serif" font-size="8" font-weight="400" fill="#e8ecf0" letter-spacing="0.3" opacity="0.75">travelviet</text>
  <text x="41" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#e8ecf0" letter-spacing="-0.3">planer</text>
</svg>
